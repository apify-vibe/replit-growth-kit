# Real-case scenario matrix. Requests are phrased after real MCP usage: the Actors real MCP users
# call (Snowflake run origins, Jul-Oct 2026) and real apify.com Store search phrases.
# Source: ~/.claude/context/projects/replit-growth-kit/mcp-usage-scenarios-2026-10.md
# MCP prompts are not logged anywhere, so requests are constructed on those anchors, not copied.

builder_script:
  product_summary: "Confirm it as written."
  spend_gate: "yes, go ahead"
  any_other_question: "Use your judgment and the defaults in the skill."

cases:
  - id: lead-good-maps
    skill: open-web-lead-engine
    fixture: shiftly
    fit: good
    request: "Find independent restaurants in Austin I could pitch Shiftly to. I need the owner or manager name and an email, in a leads table."
    anchors: "compass/crawler-google-places 24.9K MCP users, 'google maps email', 'lead generation'"

  - id: lead-good-search
    skill: open-web-lead-engine
    fixture: briefcraft
    fit: good
    request: "I need an apollo scraper alternative: 30 small marketing agencies in London with the founder's name and email."
    anchors: "'apollo scraper' 1,131, 'email finder', vdrmota/contact-info-scraper"

  - id: lead-bad-consumer
    skill: open-web-lead-engine
    fixture: habitloop
    fit: bad
    request: "Build me a cold email list to get my first 1,000 users."
    expect: "Stops before any paid run, explains outbound does not fit a $4.99 consumer app, points to UGC / Consumer & Viral Potential skills."

  - id: demand-good-reddit
    skill: demand-signal-scan
    fixture: invoicepilot
    fit: good
    request: "Search reddit and X for freelancers complaining about chasing late invoices. Give me the top threads with direct quotes."
    anchors: "'reddit scraper' 1,200, trudax/reddit-scraper-lite 7.2K MCP users, apidojo/tweet-scraper"

  - id: demand-good-youtube
    skill: demand-signal-scan
    fixture: habitloop
    fit: good
    request: "Why do people quit habit trackers? Check youtube comments and reddit and group the pain points."
    anchors: "'youtube comments' 341, streamers/youtube-comments-scraper 2.4K MCP users"

  - id: demand-bad-private
    skill: demand-signal-scan
    fixture: pvintake
    fit: bad
    request: "Find where my buyers talk about their problems online."
    expect: "One cheap probe at most, then stops: the problem is not discussed in public. Points to ICP & Market Sizing."

  - id: teardown-good-smb
    skill: competitor-teardown
    fixture: shiftly
    fit: good
    request: "Do a full competitor teardown for Shiftly: pricing, reviews, what people complain about, their ads, anything useful."
    anchors: "trustpilot 971, capterra 132, g2 185, 'meta ads' 1,689, 'google ads' 1,318"

  - id: teardown-good-prosumer
    skill: competitor-teardown
    fixture: invoicepilot
    fit: good
    request: "What do people hate about FreshBooks and Wave? Check reviews everywhere and put competitor pricing side by side."
    anchors: "trustpilot, 'app store reviews', rag-web-browser"

  - id: teardown-edge-hidden-pricing
    skill: competitor-teardown
    fixture: ledgerguard
    fit: edge
    request: "How does LedgerGuard stack up against Vanta and Drata?"
    expect: "Detects demo-gated pricing, skips the pricing crawl or reports it as hidden, still delivers reviews, hiring and ads angles."

  - id: creator-good-tiktok
    skill: creator-shortlist
    fixture: habitloop
    fit: good
    request: "Find TikTok and Instagram creators posting about study habits and productivity with 10k to 200k followers and good engagement, with emails if they publish one."
    anchors: "apify/instagram-profile-scraper 21.0K MCP users, clockworks/tiktok-scraper 10.4K, 'instagram email' 937"

  - id: creator-good-youtube
    skill: creator-shortlist
    fixture: invoicepilot
    fit: good
    request: "YouTube channels about freelancing or running a design business, 5k to 100k subscribers, with a business email."
    anchors: "'youtube channel' 535, 'youtube email' 433, streamers/youtube-scraper"

  - id: creator-bad-enterprise
    skill: creator-shortlist
    fixture: ledgerguard
    fit: bad
    request: "Find influencers to promote LedgerGuard."
    expect: "Stops before any paid run: enterprise procurement purchase, not UGC. Points to outbound skills."

  # v2 lead-engine lanes (added 2026-10-04)
  - id: lead-good-linkedin-title
    skill: open-web-lead-engine
    fixture: ledgerguard
    fit: good
    request: "Find CTOs and heads of engineering at 50 to 200 person SaaS companies in Germany that sell to enterprises. I need their LinkedIn and a work email."
    anchors: "harvestapi/linkedin-profile-search 6.5K MCP users, harvestapi/linkedin-company-employees 3.5K, 'linkedin email' 1,097"

  - id: lead-good-domains
    skill: open-web-lead-engine
    fixture: briefcraft-waitlist
    fit: good
    request: "Here are the domains from my waitlist (waitlist.csv). Pull the founder or owner contact from each website and verify the emails."
    anchors: "vdrmota/contact-info-scraper 2.0K, 'email finder' 920, 'email verifier' 484, 'website email' 280"

  # creator + demand v2 (added 2026-10-05)
  - id: creator-good-linkedin
    skill: creator-shortlist
    fixture: briefcraft
    fit: good
    request: "Find LinkedIn and X creators who talk to agency owners about running an agency, with an email if they publish one."
    anchors: "harvestapi/linkedin-profile-posts 6.4K MCP users, harvestapi/linkedin-post-search 5.8K, apidojo/tweet-scraper 5.2K"

  - id: creator-good-sponsorships
    skill: creator-shortlist
    fixture: invoicepilot
    fit: good
    request: "Which newsletters and podcasts do freelancers read that I could sponsor?"
    anchors: "newsletter and podcast sponsorship; Store search 'influencer' 273"

  - id: demand-good-linkedin
    skill: demand-signal-scan
    fixture: shiftly
    fit: good
    request: "Is scheduling really a pain for restaurant managers? Check LinkedIn, reviews of the big scheduling apps, and how many people search for this."
    anchors: "harvestapi/linkedin-post-search 5.8K MCP users, trustpilot 971, capterra 132, 'google trends' 635"

  - id: demand-good-tiktok
    skill: demand-signal-scan
    fixture: habitloop
    fit: good
    request: "Why do people quit habit trackers? Check TikTok comments and tell me how many people search for this kind of app."
    anchors: "'tiktok comment' 924, aitorsm/keyword-volume 864"

  - id: demand-good-devtool
    skill: demand-signal-scan
    fixture: apiwatch
    fit: good
    request: "What do developers complain about with uptime monitoring tools? Look at GitHub issues, Stack Overflow and Hacker News."
    anchors: "developer audience; ryanclinton/hackernews-search; GitHub issues feature requests"
